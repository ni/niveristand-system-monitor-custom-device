trigger:
  batch: true
  branches:
    include:
      - main
      - release/*

variables:
  - name: ConvertNetCore
    value: false

resources:
  repositories:
    - repository: niveristand-custom-device-build-tools
      type: github
      ref: main
      endpoint: nivs-custom-devices
      name: ni/niveristand-custom-device-build-tools

stages:

# =====================================================================
# WINDOWS BUILD (Stage Template)
# =====================================================================
- template: azure-templates/stages.yml@niveristand-custom-device-build-tools
  parameters:
    stageName: WindowsBuild

    lvVersionsToBuild:
      - version: '2027'
        bitness: '64bit'

    buildSteps:
      - projectLocation: 'Source\System Monitor Custom Device.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Configuration Release'

      - projectLocation: 'Source\System Monitor Custom Device.lvproj'
        buildOperation: 'ExecuteBuildSpecAllTargets'
        target: 'All'
        buildSpec: 'Engine Release'

    releaseVersion: '27.0.0'
    buildOutputLocation: 'Built'
    archiveLocation: '\\nirvana\Measurements\VeriStandAddons\netcore\ni_system_monitor_custom_device'
    repoName: 'niveristand-system-monitor-custom-device'

    packages:
      - controlFileName: 'control'
        payloadMaps:
          - installLocation: 'programdata\National Instruments\NI VeriStand $(lvVersion)\Addons\Custom Devices'

# =====================================================================
# LINUX BUILD
# =====================================================================
- template: azure-templates/linux-stage.yml@niveristand-custom-device-build-tools
  parameters:
    stageName: LinuxBuild

    # If your linux-stage.yml supports these parameters:
    dependsOn: 
      - WindowsBuild
 
    lvVersionsToBuild:
      - version: '2027'
        bitness: '64bit'

    buildSteps:
      - id: 'system-monitor-custom-device_debug'
        projectLocation: 'Source/System Monitor Custom Device.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Configuration(Linux) Debug'

      - id: 'system-monitor-custom-device_release'
        projectLocation: 'Source/System Monitor Custom Device.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Configuration(Linux) Release'
      
    releaseVersion: '27.0.0'
    branch: 'main'
    debugBuild: 'no'
    buildOutputLocation: 'Built'
    archiveLocation: '\\nirvana\Measurements\VeriStandAddons\netcore\ni_system_monitor_custom_device'
    repoName: 'niveristand-system-monitor-custom-device'
